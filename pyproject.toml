[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-ai-server"
version = "0.1.0"
description = "Backend service for the AI pet health analysis WeChat mini program."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.13.0",
  "PyMySQL>=1.1.0",
  "cryptography>=42.0.0",
  "redis>=5.0.0",
  "minio>=7.2.0",
  "httpx>=0.26.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["docs*", "migrations*", "tests*"]
